  licenseUrl: https://creativecommons.org/licenses/by-nc-sa/4.0/
  adaptations:
  - Transcribed source records into YAML
  - Added inferred readable region and location labels
  - Classified merchant reward types
  - Created readable names for generic merchant roles
  - Refined select NPC display names/locations from user-provided Witcher Wiki article metadata (2026-10-14); ambiguous matches
    documented separately
  notice: This adapted dataset has CC BY-NC-SA 4.0 terms; it is not covered by the main application’s MIT license. Preserve
    attribution and license notices.
  portraitReferences: Portraits extracted from user-provided Gwent Opponent Names And Portraits Remastered 2.3 mod archive;
    source code tag-to-portrait assignments are from scripts/custom/gwent_op_names.ws. The mod and underlying Witcher art
    may have redistribution restrictions.
coverage:
